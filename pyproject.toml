[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bias-aware-selective-qa"
version = "0.1.0"
description = "Artifact for bias-aware selective QA over systematically biased numeric records."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
]

[tool.setuptools.packages.find]
include = ["bias_aware_qa*"]
